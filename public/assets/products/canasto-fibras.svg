  <path d="M242 420q208 55 416 0l-43 290q-165 80-330 0z" fill="url(#basketweave)" opacity=".9"/>
  <path d="M240 430q210 42 420 0" fill="none" stroke="#e7c48e" stroke-width="27"/>
