    <linearGradient id="fiber" x2="0" y2="1"><stop stop-color="#c79960"/><stop offset="1" stop-color="#895b36"/></linearGradient>
    <pattern id="basketweave" width="46" height="38" patternUnits="userSpaceOnUse"><path d="M0 10h46M0 29h46" stroke="#f0d4a3" stroke-width="9"/><path d="M12 0v38M34 0v38" stroke="#70492f" stroke-width="8" opacity=".75"/></pattern>
